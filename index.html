<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>הזמנה - סילקו</title><style>:root{--g:#c9a84c;--g2:#e8c97a;--b:#0f0f1a;--c:#16213e;--bd:#2a3f60;--t:#f0ead6}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--b);color:var(--t);margin:0;min-height:100vh;padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}header{position:sticky;top:0;background:var(--c);padding:calc(16px + env(safe-area-inset-top)) 16px 14px;text-align:center;border-bottom:2px solid var(--g)}h1{margin:0}.w{padding:10px}.row{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin-bottom:7px;direction:rtl}.row span{flex:1;text-align:right;direction:rtl}.gap{height:18px}.q{display:flex;direction:rtl;flex:0 0 auto;border:1px solid var(--bd);border-radius:8px;overflow:hidden}.q button,.q input{width:36px;height:34px;border:0;background:var(--b);color:var(--t);text-align:center;font-size:16px}.q button{color:var(--g);font-size:20px}textarea{width:100%;min-height:70px;background:var(--c);color:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px}.warn{text-align:center;color:var(--g2);font-weight:700;margin:12px 0}footer{position:fixed;bottom:0;left:0;right:0;background:var(--b);border-top:2px solid var(--g);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center}.send{padding:0 18px;height:42px;border:0;background:#25D366;color:#fff;border-radius:10px;font-weight:700}</style></head><body><header><h1>סילקו</h1></header><div class="w" id="list"></div><footer><div><b id="count">0</b> פריטים</div><button class="send" onclick="sendOrder()">שלח הזמנה</button></footer><script>const PHONE='972544274897',RET='‼️*לידע נהג לקח החזרות*‼️',RLM='\u200F',LRM='\u200E';const G=[['שקיות דליה','גיילורד'],['מנשא זוגי','חבק כוס 8'],['גביע 1.5 שחור','גביע 2 שחור','גביע 2.5 שחור','מכסה גביע 1.5','גביע 4 מחובר'],['מזלגון פלסטיק שקוף','קרטון ג׳בטה'],['מיכל סחיטה 12','מיכל סחיטה 24','מיכל סחיטה 32'],['פופקורן 24','פופקורן 32','פופקורן 46'],['גביע סיני 16','גביע סיני 26'],['גביע שקוף 8oz','שקיות גריסה','גביע אמריקאי','פרגמנט צץ רץ','בוחשן קוקטייל'],[RET]];const L=document.getElementById('list');G.forEach((g,gi)=>{if(gi)L.insertAdjacentHTML('beforeend','<div class="gap"></div>');g.forEach(p=>{const r=document.createElement('div');r.className='row';r.dataset.group=gi;r.innerHTML='<span></span><div class="q"><button onclick="chg(this,-1)">−</button><input type="number" min="0" value="0" inputmode="numeric"><button onclick="chg(this,1)">+</button></div>';r.querySelector('span').textContent=p;r.querySelector('input').oninput=refresh;L.appendChild(r)})});L.insertAdjacentHTML('beforeend','<textarea id="notes" placeholder="הערות להזמנה..."></textarea><div class="warn">‼️ דווח חוסרים בהקדם האפשרי ‼️</div>');function chg(b,d){const i=b.parentElement.querySelector('input');i.value=Math.max(0,(parseInt(i.value)||0)+d);refresh()}function refresh(){let t=0;document.querySelectorAll('.row input').forEach(i=>t+=parseInt(i.value)||0);count.textContent=t}function orderLine(name,q){return RLM+'• '+name+RLM+': '+LRM+q+RLM}function sendOrder(){const lines=['🛒 *הזמנה - סילקו*','📅 '+new Date().toLocaleDateString('he-IL'),'─────────────────'];let total=0;G.forEach((g,gi)=>{const sel=[];document.querySelectorAll('.row[data-group="'+gi+'"]').forEach(r=>{const q=parseInt(r.querySelector('input').value)||0;if(q>0){sel.push(orderLine(r.querySelector('span').textContent,q));total+=q}});if(sel.length)lines.push('',...sel)});if(!total){alert('לא נבחרו פריטים');return}const n=notes.value.trim();if(n)lines.push('','📝 *הערות:* '+n);lines.push('','─────────────────','✅ סה״כ: *'+total+' פריטים*','','‼️ *דווח חוסרים בהקדם האפשרי* ‼️','','*אשר*');const msg=lines.map(x=>RLM+x+RLM).join('\n');location.href='https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg)}</script></body></html>
